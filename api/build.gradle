plugins {
    id 'java-library'
    id 'maven-publish'
    id 'top.outlands.unimined' version '1.4.47'
}

group = 'dev.xy177.waterlogged'
version = rootProject.version
base {
    archivesName = 'waterlogged-api'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

unimined.minecraft {
    version '1.12.2'
    mappings { mcp('stable', '39-1.12') }
    outlands { loader '2026.11.11' }
    defaultRemapJar = false
    remap(tasks.named('jar').get()) { }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'dev'
    finalizedBy(tasks.named('remapJar'))
}

publishing {
    repositories {
        // 本地暂存仓库：GitHub Actions 先发布到这里，再把目录推到 gh-pages 分支，
        // 由 GitHub Pages 提供为 https://dollanith.github.io/waterlogging-api_FFD/
        // 本地想验证发布内容时也可以直接跑这个仓库的任务，产物在 <root>/build/gh-pages。
        maven {
            name = 'Pages'
            url = rootProject.layout.buildDirectory.dir('gh-pages')
        }
        if (publish_to_local_maven.toBoolean()) {
            mavenLocal()
        }
    }
    publications {
        api(MavenPublication) {
            groupId = 'dev.xy177.waterlogged'
            artifactId = 'waterlogged-api'
            artifact(tasks.named('remapJar'))
            artifact(tasks.named('sourcesJar')) { classifier = 'sources' }
        }
    }
}
