name: Publish API to GitHub Pages Maven

# 只在版本标签或手动触发时发布，避免 master 上的每次提交都覆盖同一个版本坐标。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        name: Set up Gradle

      - name: Add permission
        run: chmod +x ./gradlew

      # :api 的 Pages 仓库指向 <root>/build/gh-pages，发布 remapped jar + sources jar + pom。
      - name: Publish API artifact to local staging repo
        run: ./gradlew :api:publishAllPublicationsToPagesRepository

      # Jekyll 会跳过 _ 开头的路径，也没有必要为二进制仓库做站点构建。
      - name: Disable Jekyll
        run: touch build/gh-pages/.nojekyll

      # keep_files 保证 gh-pages 上已有版本的 maven 目录不被这次发布抹掉。
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/gh-pages
          publish_branch: gh-pages
          keep_files: true
